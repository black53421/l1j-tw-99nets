#-------------------------------------------------------------
# AltSettings config
# 進階設定
#-------------------------------------------------------------
#全體聊天最低等級限制
GlobalChatLevel = 30

#密語最低等級限制
WhisperChatLevel = 5

# 自動拾取模式：0=不自動拾取，1=自動拾取且包含寵物/召喚獸，2=自動拾取但不包含寵物/召喚獸
#設定自動取得道具的方式 0-掉落地上, 1-掉落寵物身上, 2-掉落角色身上
AutoLoot = 1

#設定道具掉落的範圍大小
LootingRange = 3

# 非 PvP 模式設定：True=可進行 PvP，False=不可進行 PvP
#設定PVP的模式 True=是, False=不是
NonPvP = True

# 傷害訊息開關：True=開啟，False=關閉
#設定GM是否顯示傷害訊息 True=顯示, False=不顯示
AttackMessageOn = False

# 寵物作為主要目標時，怪物魔法對寵物造成的傷害倍率。
# 適用於單體魔法，以及範圍魔法的主要目標。
# 100=正常傷害，50=50% 傷害，0=不造成傷害。
PetMonsterMagicPrimaryDamageRate = 50

# 寵物作為次要目標時，怪物範圍魔法對寵物造成的傷害倍率。
# 100=正常傷害，50=50% 傷害，0=不造成傷害。
PetMonsterMagicSecondaryAoeDamageRate = 50

# 寵物飢餓度是否影響服從行為。
# true=飽食度為 0 時，寵物會拒絕指令並進入休息狀態。
# false=飢餓度仍會下降並正常儲存/顯示，但不影響服從行為。
PetHungerAffectsObedience = false

# 是否啟用伺服器端的玩家移動實體碰撞檢查。
# 測試前請維持 false，直到客戶端的 CollisionZone 處理已停用。
ServerPlayerCollisionEnabled = false

# 是否啟用伺服器端批次強化功能。
BatchEnchantEnabled = true

# 單次批次強化請求最多可處理的裝備數量。
BatchEnchantMaxItems = 50

# 單次批次強化請求最多可消耗的邏輯強化嘗試次數。
# 安定值區間的快速處理仍會將每張消耗的強化卷軸計為一次邏輯嘗試。
BatchEnchantMaxAttempts = 400

# eb 指令啟動後，等待玩家選擇強化卷軸目標的有效秒數。
BatchEnchantArmTimeoutSeconds = 30

# 批次強化執行期間，是否拒絕會影響角色背包內容的其他操作。
BatchEnchantLockInventoryActions = true

# 批次強化策略是否允許使用一般祝福的武器/防具強化卷軸。
BatchEnchantAllowBlessedScroll = true

# 祝福卷重試策略是否允許使用一般詛咒的武器/防具強化卷軸。
BatchEnchantAllowCursedScroll = true

# 同時間允許執行的批次強化工作數量上限。
BatchEnchantMaxConcurrentJobs = 2

# 隨機/危險區單張強化嘗試之間的延遲時間；0 表示不加入延遲。
BatchEnchantRiskyAttemptDelayMillis = 15

# 單件裝備處理完成後，到開始處理下一件裝備前的延遲時間。
BatchEnchantItemDelayMillis = 10

# 是否啟用寵物與召喚獸的佇列式跟隨行為。
CompanionFollowQueueEnabled = false

# 主人與第一隻跟隨單位之間的目標距離。
CompanionFollowMasterDistance = 2

# 佇列中各跟隨單位之間的目標距離。
CompanionFollowQueueDistance = 1

# 距離達到或超過此值時，略過跟隨佇列並直接追蹤主人。
CompanionFollowDirectDistance = 6

# 連續移動受阻達到此次數後，略過跟隨佇列並直接追蹤主人。
# 0 表示佇列移動一旦受阻，就立即略過佇列。
CompanionFollowBlockedRetryCount = 5

# 跟隨單位持續受阻時，是否啟用安全重新定位。
CompanionFollowRecoveryEnabled = false

# 允許安全重新定位前，跟隨單位與主人的最小距離。
CompanionFollowRecoveryDistance = 8

# 以主人為中心搜尋可用重新定位座標的最大半徑。
CompanionFollowRecoverySearchRadius = 2

# 同一跟隨單位兩次重新定位嘗試之間的最小間隔。
CompanionFollowRecoveryCooldownMs = 1000

# 一般跟隨尋路連續找不到方向時，允許寵物與召喚獸啟用擴大尋路。
CompanionFollowExtendedSearchEnabled = true

# 連續多少次一般跟隨尋路失敗後啟用擴大尋路。
CompanionFollowExtendedSearchBlockedRetryCount = 3

# 擴大尋路允許搜尋的最大範圍；有效值為 16 到 30。
CompanionFollowExtendedSearchRange = 30

# 擴大尋路連續找不到路徑多少次後，結束本次擴大尋路模式。
CompanionFollowExtendedSearchMaxFailures = 10

# 擴大尋路模式失敗結束後，再次啟用前的最短冷卻時間，單位為毫秒。
CompanionFollowExtendedSearchCooldownMs = 3000

# 是否啟用主人移動軌跡導引；僅在非佇列跟隨模式下使用。
CompanionFollowBreadcrumbEnabled = true

# 與主人距離達到此值時，落後的寵物與召喚獸開始優先沿主人近期移動軌跡跟隨。
CompanionFollowBreadcrumbTriggerDistance = 3

# 每位玩家保留的最近移動軌跡格數；數值越大越能涵蓋長繞路，但會增加少量記憶體使用。
CompanionFollowBreadcrumbHistorySize = 64

# 每次導引時，從目前已完成的軌跡進度往前取多少格作為 waypoint。
CompanionFollowBreadcrumbLookAheadSteps = 1

# 寵物距離 waypoint 在此範圍內且地形可直接連通時，視為已完成該 waypoint；有效值為 0 或 1。
CompanionFollowBreadcrumbAdvanceDistance = 1

# 是否允許寵物與召喚獸在狹窄通道中，暫時與同一主人的寵物或召喚獸重疊通過。
CompanionNarrowPassEnabled = true

# 狹窄通道判定額外向相鄰可通行區域延伸的格數，用來涵蓋門口與轉角；有效值為 0 到 2。
CompanionNarrowPassLookAheadSteps = 1

# 預定方向被同主人寵物或召喚獸擋住時，先等待此次數再嘗試側向繞行；0 表示立即嘗試繞行。
CompanionNarrowPassBlockerHoldRetryCount = 2

# 寵物與召喚獸跟隨主人傳送時，落點只使用與主人地形可連通的位置。
CompanionTeleportReachablePlacementEnabled = true

# 安全且可連通的獨立落點不足時，允許同一主人的寵物與召喚獸共用已選定的安全落點。
CompanionTeleportOverlapFallbackEnabled = true

# 優先搜尋主人周圍安全落點的半徑。
CompanionTeleportPlacementRadius = 3

# 一般範圍沒有空位時，允許擴大的最大安全落點搜尋半徑。
CompanionTeleportEmergencyPlacementRadius = 6

# 落點實際最短路徑相較於八方向直線距離，最多允許額外繞行的格數。
# 設為 0 時只接受沒有額外繞路的落點。
CompanionTeleportMaxPathDetour = 4

# 主人到寵物落點的實際最短可行走路徑最大長度。
# 可避免落點幾何距離很近，但實際必須沿長牆繞遠路才能抵達。
CompanionTeleportMaxPathLength = 8

#是否允許自己更改稱號
ChangeTitleByOneself = false

#血盟人數上限
#0的話，按照王的魅力計算
MaxClanMember = 0

#是否開啟血盟聯盟系統(加入另一個王子的血盟) True=啟用, False=停用
ClanAlliance = True

#組隊人數上限
MaxPT = 8

#組隊聊天人數上限
MaxChatPT = 8

#設定攻城戰中紅人死亡後是否會受到處罰 True=是, False=否
SimWarPenalty = True

#設定重新登入時是否在出生地 True=是, False=否
GetBack = False

#地圖上地面道具刪除設置 none|std|auto
#none - 不刪除
#std - 指定道具每隔多長時間刪除
#auto - 指定每隔多長時間地面道具一起刪除
ItemDeletionType = std

#設定物品在地面自動清除掉的時間（分）
#1-35791 (0=關閉自動清除地面物品)
ItemDeletionTime = 10

#設定人物周圍不清除物品範圍大小
#ItemDeletionType設定std的話，範圍大小無視
#0-5（0指定，連玩家腳下的東西也刪除）
ItemDeletionRange = 5

#設定是否開啟GM商店... True=開啟, False=關閉
GMshop = False

#設定GM商店編號最小值與最大值設定，可查看在spawnlist_npc內的編號進行設定
GMshopMinID = 1
GMshopMaxID = 32

#南瓜怪任務開關設置... True=開, False=關
HalloweenIvent = False

#日本特典道具NPC開關設置... True=開, False=關
JpPrivileged = False

#說話卷軸任務開關設置... True=開, False=關
TalkingScrollQuest = False

#設定 /who 指令是否可以使用 True=可以, False=不可以
WhoCommand = True

#設定99級是否可以獲得返生藥水 True=可以, False=不可以
RevivalPotion = false

#設定 攻城戰時間(d:日 h:時 m:分)
WarTime = 2h

#設定 攻城日的間隔(d:日 h:時 m:分)
WarInterval = 4d

#設定 是否使用範圍性怪物刷新...True=是, False=否
SpawnHomePoint = true

#設定 怪物刷新的範圍大小。
SpawnHomePointRange = 8

#SpawnHomePointCount、SpawnHomePointDelay 設定迴避適用出生點 (不適用於首領怪等等) 
#適用出生點設定最小 count (2的話，count 只有2以上 spawnlist 設定出生點)
SpawnHomePointCount = 2
#適用出生點設定的最大 min_respawn_delay (100的話，min_respawn_delay 只有100以下 spawnlist 設定出生點)
SpawnHomePointDelay = 100

#服務器啟動時Boss是否出現。... True=是, False=否。
#false的話，將依照BossCycle設置進行。
InitBossSpawn = True

#妖精森林 元素石 的數量
ElementalStoneAmount = 300

#盟屋稅金的支付期限(日)
HouseTaxInterval = 10

#設定魔法娃娃召喚數量上限
MaxDollCount = 1

#是否允許使用「釋放元素」技能：True=開啟，False=關閉
ReturnToNature = false

#NPC(召喚, 寵物)身上可以持有的最大物品數量
MaxNpcItem = 8

#個人倉庫物品上限數量
MaxPersonalWarehouseItem = 150

#血盟倉庫物品上限數量
MaxClanWarehouseItem = 200

#角色等級30以上，刪除角色是否要等待7天。... True=是, False=否
DeleteCharacterAfter7Days = True

#NPC死亡後屍體消失時間（秒）
NpcDeletionTime = 10

#預設角色欄位數量
#預設角色數量
DefaultCharacterSlot = 6

#妖精森林 NPC 道具重置時間
#妖精森林NPC道具重置時間  #預設 10
GDropItemTime = 10

# 怪物被同一角色阻擋移動時，允許的失敗重試次數；超過後
# 怪物會暫時將目標切換為該阻擋角色。
# 0=永不因路徑阻擋切換目標（持續重試）
# 1=先重試 1 次，第 2 次受阻時切換目標
# 3=先重試 3 次，第 4 次受阻時切換目標
NpcBlockerRetryCount=3