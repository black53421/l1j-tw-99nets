# 是否啟用資料庫驅動的魔法武器系統。
WeaponMagicEnabled = true

# 所有魔法武器的觸發率倍率。1.0 表示使用資料庫原始設定。
WeaponMagicTriggerRate = 1.0

# 所有魔法武器的最終傷害倍率。
WeaponMagicDamageRate = 1.0

# 魔法武器對怪物造成的額外傷害倍率。
WeaponMagicPveDamageRate = 1.0

# 魔法武器對玩家造成的額外傷害倍率。
WeaponMagicPvpDamageRate = 1.0

# 魔法武器是否套用目標 MR 減傷。
WeaponMagicUseMrReduction = true

# 魔法武器是否套用目標屬性抗性減傷。
WeaponMagicUseAttributeReduction = true

# 是否允許 weapon_skill.enchant_rate 使用武器強化值計算傷害。
WeaponMagicEnchantBonusEnabled = true

# 是否允許武器強化值提高魔法武器觸發率。
WeaponMagicEnchantTriggerBonusEnabled = true

# 強化觸發率加成的全域倍率。1.0 表示使用資料庫原始設定。
WeaponMagicEnchantTriggerBonusRate = 1.0

# 對怪物生效的強化觸發率加成百分點上限。
WeaponMagicPveMaxEnchantTriggerBonus = 100.0

# 對玩家生效的強化觸發率加成百分點上限。
WeaponMagicPvpMaxEnchantTriggerBonus = 100.0

# 對怪物的魔法武器最終觸發率上限。
WeaponMagicPveMaxTriggerProbability = 100.0

# 對玩家的魔法武器最終觸發率上限。
WeaponMagicPvpMaxTriggerProbability = 100.0

# 是否允許 weapon_skill.mr_penetration 穿透正 MR。
WeaponMagicMrPenetrationEnabled = true

# 是否允許 weapon_skill.attr_penetration 穿透正屬性抗性。
WeaponMagicAttributePenetrationEnabled = true

# 對怪物生效的 MR 穿透百分比上限。
WeaponMagicPveMaxMrPenetration = 100.0

# 對玩家生效的 MR 穿透百分比上限。
WeaponMagicPvpMaxMrPenetration = 50.0

# 對怪物生效的屬性抗性穿透百分比上限。
WeaponMagicPveMaxAttributePenetration = 100.0

# 對玩家生效的屬性抗性穿透百分比上限。
WeaponMagicPvpMaxAttributePenetration = 50.0
